function aoStep(){if(!AO.on)return;if(RST)return aoStop();if(XB)return aoLoop();

const p=PK[AO.i];let k;

S.opened++;AS={n:0,g:0};const kept=autoSell(k.cs);AO.done++;const q=AO.s;q.packs++;q.kept+=kept.length;q.sold+=AS.n;q.gold+=AS.g;

async function zip(u,s){return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(s)).arrayBuffer())}
async function saveCode(){const o=JSON.parse(JSON.stringify(S));o.m=o.m.map(x=>+x.toFixed(3));delete o.pm;let u=new TextEncoder().encode(JSON.stringify(o)),pre='MCS0';
if(window.CompressionStream){u=await zip(u,new CompressionStream('deflate-raw'));pre='MCS1'}const x=new Uint8Array(u.length+2);x.set(u);x.set(ck(u),u.length);return pre+'.'+b64(x)}
async function loadCode(t){const[pre,b]=t.replace(/\s/g,'').split('.');if((pre!='MCS0'&&pre!='MCS1')||!b)throw 0;const u=ub(b),body=u.slice(0,-2),c=ck(body);if(c[0]!=u[u.length-2]||c[1]!=u[u.length-1])throw 0;
const j=pre=='MCS1'?await zip(body,new DecompressionStream('deflate-raw')):body,o=JSON.parse(new TextDecoder().decode(j));
if(!o||typeof o.em!='number'||!Array.isArray(o.cards)||!Array.isArray(o.m)||!o.cards.every(c=>c&&Number.isInteger(c.k)&&c.k>=0&&c.k<D.length))throw 0;
o.pm=o.m.slice();o.log=o.log||[];o.dex=o.dex||[];return o}
