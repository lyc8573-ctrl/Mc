services:
  - type: web
    name: gacha
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gacha-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: gacha-db
    plan: free
