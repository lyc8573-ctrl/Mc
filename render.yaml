services:
  - type: web
    name: minimal-capital
    runtime: node
    plan: starter
    buildCommand: echo ok
    startCommand: node server.js
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
