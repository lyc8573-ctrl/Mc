<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>極簡資本 後台</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}body{margin:0;background:#f4f6f9;color:#222}
header{background:#212529;color:#fff;padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}header b{margin-right:10px}
header button{background:#343a40;color:#fff;border:0;padding:7px 12px;border-radius:6px;cursor:pointer}header button.on{background:#0d6efd}
main{padding:16px;max-width:1100px;margin:auto}.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{text-align:center}.stat b{font-size:1.5rem;display:block}
input,select{padding:7px;border:1px solid #ccc;border-radius:6px;margin:2px}button.b{padding:7px 12px;border:0;border-radius:6px;background:#198754;color:#fff;cursor:pointer;margin:2px}
button.r{background:#dc3545}button.y{background:#fd7e14}button.g{background:#6c757d}table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
.on-dot{color:#198754}.off-dot{color:#aaa}h3{margin:0 0 8px}small{color:#666}.wrap{overflow-x:auto}
</style></head><body>
<div id="login" style="max-width:320px;margin:90px auto;text-align:center"><h2>後台登入</h2><input id="pw" type="password" placeholder="管理員密碼" style="width:100%"><br><button class="b" onclick="login()" style="width:100%;margin-top:8px">登入</button></div>
<div id="app" style="display:none"><header><b>🛠 極簡資本 後台</b>
<button onclick="tab('ov')">總覽</button><button onclick="tab('pl')">玩家</button><button onclick="tab('ev')">活動</button><button onclick="tab('gf')">發放/公告</button><button onclick="tab('cd')">兌換碼</button><button onclick="tab('st')">設定/日誌</button></header><main id="m"></main></div>
<script>
let T=sessionStorage.adm||'',cur='ov',timer;const $=s=>document.querySelector(s),v=id=>document.getElementById(id).value;
const fmt=n=>Number(n).toLocaleString('zh-TW'),ago=t=>t?new Date(t).toLocaleString('zh-TW'):'-';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function A(p,body,method){const r=await fetch('/admin/api/'+p,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json','x-admin':T},body:body&&JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(r.status==401&&p!='login'){logout();throw j.error}if(!r.ok){alert(j.error||r.status);throw j.error}return j}
async function login(){try{T=(await A('login',{password:v('pw')})).token;sessionStorage.adm=T;init()}catch{}}
function logout(){sessionStorage.adm='';T='';$('#app').style.display='none';$('#login').style.display='block'}
function init(){$('#login').style.display='none';$('#app').style.display='block';tab('ov')}
function tab(t){cur=t;clearInterval(timer);document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',b.getAttribute('onclick')=="tab('"+t+"')"));R[t]();if(t=='ov'||t=='pl')timer=setInterval(R[t],5000)}
const cmdForm=(id,extra='')=>`<select id="${id}t" onchange="cf('${id}')"><option value="money">增加金錢(可負數)</option><option value="setmoney">設定金錢</option><option value="buff">發放 Buff</option><option value="cores">資本核心</option><option value="rebirth">重生次數</option><option value="reset">重置進度</option></select>
<input id="${id}v" placeholder="數值" style="width:140px"><span id="${id}b" style="display:none"><select id="${id}r"><option value="">指定稀有度…</option><option value="0">普通</option><option value="1">稀有</option><option value="2">史詩</option><option value="3">傳說</option><option value="4">神話</option><option value="5">創世</option></select><input id="${id}i" placeholder="或 Buff 編號 0~299" style="width:140px"><input id="${id}c" placeholder="數量" value="1" style="width:70px"></span><input id="${id}m" placeholder="給玩家的訊息(選填)" style="width:180px">${extra}`;
function cf(id){const t=v(id+'t');$('#'+id+'b').style.display=t=='buff'?'inline':'none';$('#'+id+'v').style.display=(t=='buff'||t=='reset')?'none':'inline'}
const getCmd=id=>({type:v(id+'t'),value:v(id+'v'),rarity:v(id+'r'),id:v(id+'i'),count:v(id+'c'),msg:v(id+'m')});
const R={
async ov(){const d=await A('overview');$('#m').innerHTML=`<div class="grid">${[['玩家總數',d.total],['線上',d.online],['全服總金錢',fmt(d.money)],['進行中活動',d.events],['可疑玩家',d.flagged],['狀態',d.settings.maintenance?'🔧維護中':'✅運作中']].map(x=>`<div class="card stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>
<div class="card"><h3>🏆 財富榜 Top 10</h3><table>${d.top.map((p,i)=>`<tr><td>${i+1}</td><td>${p.online?'🟢':'⚪'} ${esc(p.name)}</td><td>$${fmt(p.balance)}</td><td>重生 ${p.rebirths}</td></tr>`).join('')}</table></div>`},
async pl(){const q=document.getElementById('q')?v('q'):'';const d=await A('players?q='+encodeURIComponent(q));
$('#m').innerHTML=`<div class="card"><input id="q" placeholder="搜尋玩家" value="${esc(q)}" onkeydown="if(event.key=='Enter')R.pl()"><button class="b" onclick="R.pl()">搜尋</button> <small>每 5 秒自動更新</small></div><div class="card wrap"><table><tr><th></th><th>名稱</th><th>現金</th><th>存款</th><th>貸款</th><th>重生</th><th>核心</th><th>Buff</th><th>可疑</th><th>最後上線</th><th></th></tr>
${d.map(p=>`<tr><td>${p.online?'<span class=on-dot>●</span>':'<span class=off-dot>●</span>'}</td><td>${esc(p.name)}${p.banned?' 🚫':''}</td><td>${fmt(p.balance)}</td><td>${fmt(p.bank)}</td><td>${fmt(p.loan)}</td><td>${p.rebirths}</td><td>${p.cores}</td><td>${p.buffs}</td><td>${p.strikes?'<b style=color:#dc3545>⚠'+p.strikes+'</b>':''}</td><td>${ago(p.lastSeen)}</td><td><button class="b" onclick="detail('${p.id}')">管理</button></td></tr>`).join('')}</table></div><div id="dt"></div>`;if(q)document.getElementById('q').focus()},
async ev(){const d=await A('events');const t=Date.now();
$('#m').innerHTML=`<div class="card"><h3>建立活動</h3><input id="en" placeholder="活動名稱" value="雙倍金錢週末">
<select id="et"><option value="all">全部收益倍率</option><option value="click">點擊收益倍率</option><option value="income">公司被動收益倍率</option><option value="rain">金錢雨（每隔 N 秒發錢給線上玩家）</option></select>
<input id="ef" placeholder="倍率 / 每次金額" value="2" style="width:140px"><input id="ei" placeholder="雨間隔秒" value="30" style="width:90px"><input id="em" placeholder="持續分鐘" value="30" style="width:90px"><input id="ed" placeholder="幾分鐘後開始" value="0" style="width:110px">
<button class="b" onclick="mkEv()">建立並通知全服</button><br><small>倍率會與裝備 Buff、重生等相乘；金錢雨：倍率欄=每次發放金額。</small></div>
<div class="card wrap"><h3>活動列表</h3><table><tr><th>名稱</th><th>類型</th><th>倍率/金額</th><th>狀態</th><th>時間</th><th></th></tr>${d.map(e=>{const s=e.ended?'已結束':e.start>t?'預告中':e.end>t?'🟢進行中':'已結束';return`<tr><td>${esc(e.name)}</td><td>${e.type}</td><td>${fmt(e.factor)}</td><td>${s}</td><td>${ago(e.start)} ~ ${ago(e.end)}</td><td>${s=='已結束'?'':`<button class="b r" onclick="endEv('${e.id}')">結束</button>`}</td></tr>`}).join('')}</table></div>`},
gf(){$('#m').innerHTML=`<div class="card"><h3>📢 全服公告</h3><input id="at" placeholder="公告內容" style="width:60%"><select id="as"><option value="info">一般</option><option value="event">活動</option></select><button class="b" onclick="ann()">發送</button></div>
<div class="card"><h3>🎁 全服發放</h3><select id="gt"><option value="online">僅線上玩家</option><option value="all">所有玩家（離線者下次上線領取）</option></select>${cmdForm('g','<button class="b y" onclick="gift()">發放</button>')}</div>`;cf('g')},
async cd(){const d=await A('codes');$('#m').innerHTML=`<div class="card"><h3>建立兌換碼</h3><input id="cc" placeholder="代碼(留空自動產生)" style="width:160px">${cmdForm('k')}<input id="cu" placeholder="可兌換次數" value="100" style="width:100px"><input id="ce" placeholder="幾分鐘後過期(空=不過期)" style="width:170px"><button class="b" onclick="mkCode()">建立</button></div>
<div class="card wrap"><table><tr><th>代碼</th><th>內容</th><th>使用</th><th>過期</th><th></th></tr>${Object.entries(d).map(([k,c])=>`<tr><td><b>${k}</b></td><td>${c.cmd.type} ${c.cmd.value||c.cmd.id||('稀有度'+c.cmd.rarity)}</td><td>${c.uses}/${c.maxUses}</td><td>${c.expires?ago(c.expires):'-'}</td><td><button class="b r" onclick="delCode('${k}')">刪除</button></td></tr>`).join('')}</table></div>`;cf('k')},
async st(){const s=(await A('overview')).settings,l=await A('log');$('#m').innerHTML=`<div class="card"><h3>伺服器設定</h3><label><input type="checkbox" id="mt" ${s.maintenance?'checked':''}> 維護模式（踢出全部玩家並禁止登入）</label><br><input id="mo" placeholder="維護/公告訊息" value="${esc(s.motd)}" style="width:60%"><br><b>防作弊</b> <select id="ac"><option value="off" ${s.ac=='off'?'selected':''}>關閉</option><option value="flag" ${s.ac=='flag'?'selected':''}>只標記（不影響玩家）</option><option value="reject" ${s.ac=='reject'?'selected':''}>拒絕異常存檔並還原</option></select> 累計可疑幾次自動封鎖(0=不封) <input id="ab" value="${s.autoBan}" style="width:60px"> 每秒最高點擊數 <input id="mc" value="${s.maxCps}" style="width:60px"><br><button class="b" onclick="setS()">儲存</button> <a href="#" onclick="bk();return false">下載資料備份</a> <button class="b g" onclick="logout()">登出後台</button></div>
<div class="card wrap"><h3>操作日誌</h3><table>${l.map(x=>`<tr><td>${ago(x.t)}</td><td>${esc(x.m)}</td></tr>`).join('')}</table></div>`}};
async function detail(id){const p=await A('player/'+id);$('#dt').innerHTML=`<div class="card"><h3>${esc(p.name)} <small>登入金鑰：${p.key}</small></h3><p>現金 $${fmt(p.balance)}｜存款 ${fmt(p.bank)}｜貸款 ${fmt(p.loan)}｜待領取指令 ${p.pending}｜註冊 ${ago(p.created)}</p>
${p.flags.length?`<div style="background:#fff3cd;padding:8px;border-radius:6px;margin:6px 0;font-size:.85rem"><b>⚠ 可疑紀錄（${p.strikes} 次）</b> <button class="b g" onclick="A('player/${id}/clearflags',{}).then(()=>detail('${id}'))">清除</button>${p.flags.slice(0,5).map(f=>`<div>${ago(f.t)}：${esc(f.r.join('；'))}</div>`).join('')}</div>`:''}${cmdForm('p','<button class="b y" onclick="pcmd(\''+id+'\')">執行</button>')}<br>
<input id="pb" placeholder="封鎖/踢出原因"><button class="b r" onclick="pban('${id}',true)">封鎖</button><button class="b g" onclick="pban('${id}',false)">解封</button><button class="b y" onclick="A('player/${id}/kick',{reason:v('pb')})">踢出</button>
<input id="pn" placeholder="新名稱"><button class="b" onclick="A('player/${id}/rename',{name:v('pn')}).then(R.pl)">改名</button><button class="b r" onclick="if(confirm('永久刪除此玩家？'))A('player/${id}',null,'DELETE').then(R.pl)">刪除帳號</button></div>`;cf('p');$('#dt').scrollIntoView()}
const done=()=>alert('已完成');
function pcmd(id){A('player/'+id+'/cmd',getCmd('p')).then(r=>alert(r.online?'玩家在線，已即時套用':'玩家離線，下次上線時套用'))}
function pban(id,b){A('player/'+id+'/ban',{banned:b,reason:v('pb')}).then(R.pl)}
function gift(){if(confirm('確定發放？'))A('gift',Object.assign(getCmd('g'),{target:v('gt')})).then(r=>alert('已發放給 '+r.count+' 位玩家'))}
function ann(){A('announce',{text:v('at'),style:v('as')}).then(done)}
function mkEv(){A('events',{name:v('en'),type:v('et'),factor:v('ef'),interval:v('ei'),minutes:v('em'),delayMinutes:v('ed')}).then(R.ev)}
function endEv(id){A('events/'+id+'/end',{}).then(R.ev)}
function mkCode(){A('codes',Object.assign(getCmd('k'),{code:v('cc'),maxUses:v('cu'),expireMinutes:Number(v('ce'))||0})).then(r=>{alert('已建立：'+r.code);R.cd()})}
function delCode(c){A('codes/'+c,null,'DELETE').then(R.cd)}
function setS(){A('settings',{maintenance:$('#mt').checked,motd:v('mo'),ac:v('ac'),autoBan:v('ab'),maxCps:v('mc')}).then(R.st)}
async function bk(){const r=await fetch('/admin/api/backup',{headers:{'x-admin':T}});const u=URL.createObjectURL(await r.blob());Object.assign(document.createElement('a'),{href:u,download:'backup.json'}).click()}
document.getElementById('pw').addEventListener('keydown',e=>e.key=='Enter'&&login());if(T)A('overview').then(init).catch(()=>{});
</script></body></html>
