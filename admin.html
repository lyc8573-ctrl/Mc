<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>極簡資本 後台</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}body{margin:0;background:#f4f6f9;color:#222;overflow-anchor:none}
header{background:#212529;color:#fff;padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5}header b{margin-right:10px}
header button{background:#343a40;color:#fff;border:0;padding:7px 12px;border-radius:6px;cursor:pointer}header button.on{background:#0d6efd}
main{padding:16px;max-width:1100px;margin:auto;min-height:100vh}.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{text-align:center}.stat b{font-size:1.4rem;display:block}
input,select,textarea{padding:7px;border:1px solid #ccc;border-radius:6px;margin:2px}button.b{padding:7px 12px;border:0;border-radius:6px;background:#198754;color:#fff;cursor:pointer;margin:2px}
button.r{background:#dc3545}button.y{background:#fd7e14}button.g{background:#6c757d}button.p{background:#6f42c1}table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
.on-dot{color:#198754}.off-dot{color:#aaa}h3{margin:0 0 8px}small{color:#666}.wrap{overflow-x:auto}.warn{background:#fff3cd;padding:8px;border-radius:6px;margin:6px 0;font-size:.85rem}
</style></head><body>
<div id="login" style="max-width:320px;margin:90px auto;text-align:center"><h2>後台登入</h2><input id="pw" type="password" placeholder="管理員密碼" style="width:100%"><br><button class="b" onclick="login()" style="width:100%;margin-top:8px">登入</button></div>
<div id="app" style="display:none"><header><b>🛠 極簡資本 後台</b>
<button data-t="ov">總覽</button><button data-t="pl">玩家</button><button data-t="bn">封鎖</button><button data-t="mk">股市</button><button data-t="ev">活動</button><button data-t="gf">發放/公告</button><button data-t="cd">兌換碼</button><button data-t="st">設定/日誌</button></header><main id="m"></main></div>
<script>
const CARDS=["白銀初心卡", "青銅啟航卡", "黑曜獵手卡", "翡翠光輝卡", "藍寶石天際卡", "琥珀流光卡", "紫晶星雲卡", "紅蓮誓約卡", "鈦空量子卡", "極光幻境卡", "深海沉香卡", "烈陽霸者卡", "月華永恆卡", "賽博霓虹卡", "虛空暗物質卡", "黃金王者卡", "白金聖裁卡", "鑽石永恆卡", "星核裂變卡", "超新星爆發卡", "黑洞重力卡", "時空交響卡", "維度崩裂卡", "阿卡西記錄卡", "混沌初始卡", "銀河主宰卡", "宇宙心靈卡", "不朽神性卡", "萬物終焉卡", "創世神域卡"];
let T=sessionStorage.adm||'',timer,PL=[];const $=s=>document.querySelector(s),v=id=>document.getElementById(id).value;
const fmt=n=>Number(n).toLocaleString('zh-TW'),ago=t=>t?new Date(t).toLocaleString('zh-TW'):'-';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function A(p,body,method){const r=await fetch('/admin/api/'+p,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json','x-admin':T},body:body&&JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(r.status==401&&p!='login'){logout();throw j.error}if(!r.ok){alert(j.error||r.status);throw j.error}return j}
async function login(){try{T=(await A('login',{password:v('pw')})).token;sessionStorage.adm=T;init()}catch{}}
function logout(){sessionStorage.adm='';T='';$('#app').style.display='none';$('#login').style.display='block'}
function init(){$('#login').style.display='none';$('#app').style.display='block';tab('ov')}
document.querySelectorAll('header button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
// 切頁：只在手動切換時回到頂端；自動更新時保留捲動位置與輸入內容
function tab(t){clearInterval(timer);document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));window.scrollTo(0,0);R[t]();if(t=='ov'||t=='pl'||t=='bn'||t=='mk')timer=setInterval(()=>keep(()=>R[t](true)),6000)}
async function keep(f){if(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.closest('#dt,.card form'))return;const y=scrollY;await f();scrollTo(0,y)}
const cmdForm=(id,extra='')=>`<select id="${id}t" onchange="cf('${id}')"><option value="money">增加金錢(可負數)</option><option value="setmoney">設定金錢</option><option value="buff">發放 Buff</option><option value="cores">資本核心</option><option value="rebirth">重生次數</option><option value="card">設定卡片等級</option><option value="reset">重置進度</option></select>
<input id="${id}v" placeholder="數值" style="width:140px"><select id="${id}k" style="display:none">${CARDS.map((n,i)=>`<option value="${i}">${i} 級｜${n}</option>`).join('')}</select><span id="${id}b" style="display:none"><select id="${id}r"><option value="">指定稀有度…</option><option value="0">普通</option><option value="1">稀有</option><option value="2">史詩</option><option value="3">傳說</option><option value="4">神話</option><option value="5">創世</option></select><input id="${id}i" placeholder="或 Buff 編號 0~299" style="width:140px"><input id="${id}c" placeholder="數量" value="1" style="width:70px"></span><input id="${id}m" placeholder="給玩家的訊息(選填)" style="width:180px">${extra}`;
function cf(id){const t=v(id+'t');$('#'+id+'b').style.display=t=='buff'?'inline':'none';$('#'+id+'v').style.display=(t=='buff'||t=='reset'||t=='card')?'none':'inline';$('#'+id+'k').style.display=t=='card'?'inline':'none'}
const getCmd=id=>({type:v(id+'t'),value:v(id+'t')=='card'?v(id+'k'):v(id+'v'),rarity:v(id+'r'),id:v(id+'i'),count:v(id+'c'),msg:v(id+'m')});
const rows=d=>d.map(p=>`<tr><td>${p.online?'<span class=on-dot>●</span>':'<span class=off-dot>●</span>'}</td><td>${esc(p.name)}${p.banned?' 🚫':''}</td><td>${fmt(p.balance)}</td><td>${fmt(p.bank)}</td><td>${fmt(p.loan)}</td><td>${p.rebirths}</td><td>${p.cores}</td><td>${p.buffs}</td><td>${p.strikes?'<b style=color:#dc3545>⚠'+p.strikes+'</b>':''}</td><td>${ago(p.lastSeen)}</td><td><button class="b" onclick="detail('${p.id}')">管理</button></td></tr>`).join('');
const chart=h=>{if(!h||h.length<2)return'<small>資料收集中（每分鐘記錄一次線上人數）</small>';const mx=Math.max(1,...h.map(x=>x[1])),t0=h[0][0],t1=h[h.length-1][0]||1,pts=h.map(x=>`${(x[0]-t0)/(t1-t0||1)*600},${110-x[1]/mx*100}`).join(' ');return`<svg viewBox="0 0 600 120" style="width:100%;height:120px;background:#f8f9fa;border-radius:6px"><polyline fill="none" stroke="#0d6efd" stroke-width="2" points="${pts}"/><text x="4" y="12" font-size="11" fill="#666">最高 ${mx} 人｜${ago(t0)} ~ 現在</text></svg>`};
const R={
async ov(auto){const [d,pl]=await Promise.all([A('overview'),A('players')]);PL=pl;const k=v0=>document.getElementById('bd')?v('bd'):'balance';const key=k();
const top=pl.slice().sort((a,b)=>b[key]-a[key]).slice(0,10);
const gh=d.gh||{};const ghBox=gh.on?`<div class="warn" style="background:${gh.err?'#f8d7da':'#d1e7dd'}"><b>☁ GitHub 雲端備份：${gh.err?'失敗':'運作中'}</b>（倉庫 ${esc(gh.repo)}）<br><small>上次備份：${gh.last?ago(gh.last):'尚未備份（約每 2 分鐘有變動時自動備份）'}${gh.err?'｜錯誤：'+esc(gh.err):''}</small> <button class="b" onclick="A('pushnow',{}).then(()=>{alert('已備份到 GitHub');R.ov()})">立即備份</button></div>`:'';
$('#m').innerHTML=`${ghBox}<div class="grid">${[['玩家總數',d.total],['線上',d.online],['全服總金錢',fmt(d.money)],['進行中活動',d.events],['可疑玩家',d.flagged],['狀態',d.settings.maintenance?'🔧維護中':'✅運作中']].map(x=>`<div class="card stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>
<div class="card"><h3>📈 線上人數（24 小時）</h3>${chart(d.hist)}</div>
<div class="card"><h3>🏆 排行榜 <select id="bd" onchange="R.ov()">${[['balance','現金'],['bank','存款'],['rebirths','重生'],['cores','資本核心'],['buffs','Buff 數量']].map(x=>`<option value="${x[0]}" ${x[0]==key?'selected':''}>${x[1]}</option>`).join('')}</select></h3><table>${top.map((p,i)=>`<tr><td>${i+1}</td><td>${p.online?'🟢':'⚪'} ${esc(p.name)}</td><td>${fmt(p[key])}</td></tr>`).join('')}</table></div>`},
async pl(auto){const q=document.getElementById('q')?v('q'):'';const d=await A('players?q='+encodeURIComponent(q));PL=d;
if(auto&&document.getElementById('tb')){document.getElementById('tb').innerHTML=rows(d);return}
$('#m').innerHTML=`<div class="card"><input id="q" placeholder="搜尋玩家" value="${esc(q)}" onkeydown="if(event.key=='Enter')R.pl()"><button class="b" onclick="R.pl()">搜尋</button><button class="b p" onclick="csv()">匯出 CSV</button> <small>每 6 秒自動更新表格</small></div><div class="card wrap"><table><thead><tr><th></th><th>名稱</th><th>現金</th><th>存款</th><th>貸款</th><th>重生</th><th>核心</th><th>Buff</th><th>可疑</th><th>最後上線</th><th></th></tr></thead><tbody id="tb">${rows(d)}</tbody></table></div><div id="dt"></div>`},
async bn(auto){const d=await A('bans');
$('#m').innerHTML=`<div class="card"><h3>🚫 封鎖中的帳號（${d.players.length}）</h3><div class="wrap"><table>${d.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.banReason||'')}</td><td>${p.banUntil?'至 '+ago(p.banUntil):'永久'}</td><td><button class="b g" onclick="A('player/${p.id}/ban',{banned:false}).then(R.bn)">解封（連同裝置/IP）</button></td></tr>`).join('')||'<tr><td>無</td></tr>'}</table></div></div>
<div class="card"><h3>📱 封鎖的裝置（${d.devices.length}）</h3><div class="wrap"><table>${d.devices.map(e=>`<tr><td>${esc(e.key.slice(0,8))}…</td><td>${esc(e.name||'')}</td><td>${esc(e.reason||'')}</td><td>${e.exp?'至 '+ago(e.exp):'永久'}</td><td><button class="b g" onclick="A('bans/remove',{kind:'devices',key:'${e.key}'}).then(R.bn)">解除</button></td></tr>`).join('')||'<tr><td>無</td></tr>'}</table></div></div>
<div class="card"><h3>🌐 封鎖的 IP（${d.ips.length}）</h3><div class="wrap"><table>${d.ips.map(e=>`<tr><td>${esc(e.key)}</td><td>${esc(e.name||'')}</td><td>${esc(e.reason||'')}</td><td>${e.exp?'至 '+ago(e.exp):'永久'}</td><td><button class="b g" onclick="A('bans/remove',{kind:'ips',key:'${esc(e.key)}'}).then(R.bn)">解除</button></td></tr>`).join('')||'<tr><td>無</td></tr>'}</table></div>
<form onsubmit="return false"><input id="bip" placeholder="手動封鎖 IP"><input id="bih" placeholder="小時(空=永久)" style="width:110px"><input id="bir" placeholder="原因"><button class="b r" onclick="A('bans/ip',{ip:v('bip'),hours:v('bih'),reason:v('bir')}).then(R.bn)">封鎖 IP</button></form></div>
<div class="card"><small>封鎖玩家時會同時封鎖其裝置（瀏覽器識別碼 + Cookie）、可選封鎖 IP，並一併封鎖「同裝置的其他小號」。被封裝置連遊戲頁面都打不開。IP 預設只封 24 小時，避免誤傷共用網路的人。</small></div>`},
async mk(auto){const d=await A('market');if(auto&&document.getElementById('mkb')){document.getElementById('mkb').innerHTML=mkRows(d);return}
$('#m').innerHTML=`<div class="card"><h3>📊 全服股市 ${d.frozen?'<span style="color:#dc3545">（已凍結）</span>':''}</h3><small>所有玩家看到同一組股價（由伺服器每 0.8 秒產生）。</small><br>
<b>全部股票：</b><button class="b" onclick="mkAct('shock','all',1.3)">+30%</button><button class="b" onclick="mkAct('shock','all',2)">x2</button><button class="b r" onclick="mkAct('shock','all',0.7)">-30%</button><button class="b r" onclick="mkAct('shock','all',0.5)">腰斬</button>
<label><input type="checkbox" id="mka" checked> 通知全服</label><br>
<button class="b y" onclick="mkAct('freeze',0,0,${!d.frozen})">${d.frozen?'恢復波動':'凍結股價'}</button><button class="b g" onclick="if(confirm('重設全部股價？'))A('market',{action:'reset'}).then(R.mk)">重設價格</button>
波動倍率 <input id="mkv" value="${d.volMul}" style="width:70px"><button class="b" onclick="A('market',{action:'vol',factor:v('mkv')}).then(R.mk)">套用</button></div>
<div class="card wrap"><table><thead><tr><th>股票</th><th>現價</th><th>調整</th></tr></thead><tbody id="mkb">${mkRows(d)}</tbody></table></div>`},
async ev(){const d=await A('events');const t=Date.now();
const TP=[['all','全部收益倍率'],['click','點擊收益倍率'],['income','公司被動收益倍率'],['rain','金錢雨（定時發錢給線上玩家）'],['droprain','獎勵雨（定時發 Buff/獎勵給線上玩家）'],['lottery','抽獎（結束時抽出線上幸運玩家）'],['packet','搶紅包（限量先搶先贏）'],['login','登入禮（活動期間上線即領）'],['contest','資產競賽（結束時依資產成長發獎）'],['market','股市行情（開始時全股票調價）']];
const TPL=[['雙倍金錢週末',{type:'all',factor:2,minutes:60}],['點擊狂熱',{type:'click',factor:5,minutes:30}],['被動收益 x3',{type:'income',factor:3,minutes:45}],['金錢雨',{type:'rain',factor:1000000,minutes:20,interval:15}],
['Buff 雨',{type:'droprain',minutes:15,interval:60,pt:'buff',rar:1,cnt:1}],['幸運抽獎',{type:'lottery',minutes:10,n:3,pt:'buff',rar:4,cnt:1}],['限量紅包',{type:'packet',minutes:5,n:10,pt:'money',pv:1000000000}],['每日登入禮',{type:'login',minutes:1440,pt:'money',pv:500000000,repeat:1440}],['財富競賽',{type:'contest',minutes:30,n:3,pt:'buff',rar:3,cnt:3}],['股市狂歡',{type:'market',factor:2,minutes:20,revert:1}],['股災',{type:'market',factor:0.5,minutes:15,revert:1}]];
window.TPL=TPL;
$('#m').innerHTML=`<div class="card"><h3>建立活動</h3><div style="margin-bottom:6px"><small>快速範本：</small>${TPL.map((x,i)=>`<button class="b p" onclick="tplx(${i})">${x[0]}</button>`).join('')}</div>
<form onsubmit="return false"><input id="en" placeholder="活動名稱" value="限時活動"><select id="et" onchange="evf()">${TP.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><br>
<span id="f_f"><input id="ef" placeholder="倍率 / 金額 / 股價倍率" value="2" style="width:170px"></span><span id="f_i"><input id="ei" placeholder="間隔秒" value="30" style="width:90px"></span><span id="f_n"><input id="en2" placeholder="人數/名額" value="3" style="width:100px"></span>
<input id="em" placeholder="持續分鐘" value="30" style="width:90px"><input id="ed" placeholder="幾分鐘後開始" value="0" style="width:110px"><input id="er" placeholder="每幾分鐘重複(空=不重複)" style="width:170px"><label id="f_r"><input type="checkbox" id="erv" checked>結束時股價回復</label>
<div id="f_p" style="margin-top:6px"><b>獎勵內容：</b>${cmdForm('z')}</div>
<button class="b" onclick="mkEv()">建立並通知全服</button></form><small>倍率與 Buff、重生等相乘。抽獎只抽「開獎當下在線」的玩家；紅包先搶先贏；競賽以活動期間「現金+存款」成長排名（第1名全額、第2名一半、第3名 1/4、其餘 1/10）。</small></div>
<div class="card wrap"><h3>活動列表</h3><table><tr><th>名稱</th><th>類型</th><th>內容</th><th>狀態</th><th>時間</th><th></th></tr>${d.map(e=>{const s=e.ended?'已結束':e.start>t?'預告中':e.end>t?'🟢進行中':'已結束';const pz=e.prize?`${e.prize.type} ${e.prize.value||''}${e.prize.type=='buff'?(e.prize.id?'#'+e.prize.id:'稀有度'+e.prize.rarity)+'x'+(e.prize.count||1):''}`:'x'+fmt(e.factor);const ex=[e.n&&['lottery','packet','contest'].includes(e.type)?e.n+' 名額':'',e.claimed?'已領 '+e.claimed.length:'',e.repeat?'每 '+e.repeat+' 分鐘重複':''].filter(Boolean).join('｜');return`<tr><td>${esc(e.name)}</td><td>${e.type}</td><td>${esc(pz)}<br><small>${ex}</small></td><td>${s}</td><td>${ago(e.start)}<br>~ ${ago(e.end)}</td><td>${s=='已結束'?`<button class="b p" onclick="tpl2(${esc(JSON.stringify(e)).replace(/'/g,'&#39;')})">再開一次</button>`:`<button class="b r" onclick="endEv('${e.id}')">${['lottery','contest'].includes(e.type)?'立即開獎/結算':'結束'}</button>`}</td></tr>`}).join('')}</table></div>`;cf('z');evf()},
async gf(){const aa=await A('autoann');
$('#m').innerHTML=`<div class="card"><h3>📢 全服公告</h3><input id="at" placeholder="公告內容" style="width:60%"><select id="as"><option value="info">一般</option><option value="event">活動</option></select><button class="b" onclick="ann()">發送</button></div>
<div class="card"><h3>⏰ 定時重複公告</h3><input id="aat" placeholder="公告內容" style="width:50%"><input id="aae" placeholder="每幾分鐘" value="15" style="width:100px"><button class="b" onclick="A('autoann',{text:v('aat'),every:v('aae')}).then(R.gf)">新增</button>
<table>${aa.map(a=>`<tr><td>${esc(a.text)}</td><td>每 ${a.every} 分鐘</td><td><button class="b r" onclick="A('autoann/${a.id}',null,'DELETE').then(R.gf)">刪除</button></td></tr>`).join('')}</table></div>
<div class="card"><h3>🎁 全服發放</h3><select id="gt"><option value="online">僅線上玩家</option><option value="all">所有玩家（離線者下次上線領取）</option></select>${cmdForm('g','<button class="b y" onclick="gift()">發放</button>')}</div>`;cf('g')},
async cd(){const d=await A('codes');$('#m').innerHTML=`<div class="card"><h3>建立兌換碼</h3><input id="cc" placeholder="代碼(留空自動產生)" style="width:160px">${cmdForm('k')}<input id="cu" placeholder="可兌換次數" value="100" style="width:100px"><input id="ce" placeholder="幾分鐘後過期(空=不過期)" style="width:170px"><button class="b" onclick="mkCode()">建立</button></div>
<div class="card wrap"><table><tr><th>代碼</th><th>內容</th><th>使用</th><th>過期</th><th></th></tr>${Object.entries(d).map(([k,c])=>`<tr><td><b>${k}</b></td><td>${c.cmd.type} ${c.cmd.value||c.cmd.id||('稀有度'+c.cmd.rarity)}</td><td>${c.uses}/${c.maxUses}</td><td>${c.expires?ago(c.expires):'-'}</td><td><button class="b r" onclick="delCode('${k}')">刪除</button></td></tr>`).join('')}</table></div>`;cf('k')},
async st(){const s=(await A('overview')).settings,l=await A('log'),xf=await A('xfers');window.LOG=l;$('#m').innerHTML=`<div class="card"><h3>伺服器設定</h3><label><input type="checkbox" id="mt" ${s.maintenance?'checked':''}> 維護模式（踢出全部玩家並禁止登入）</label><br><input id="mo" placeholder="維護訊息" value="${esc(s.motd)}" style="width:60%"><br>
<b>防作弊</b> <select id="ac"><option value="off" ${s.ac=='off'?'selected':''}>關閉</option><option value="flag" ${s.ac=='flag'?'selected':''}>只標記（不影響玩家）</option><option value="reject" ${s.ac=='reject'?'selected':''}>拒絕異常存檔並還原</option></select> 可疑幾次自動封鎖(0=不封) <input id="ab" value="${s.autoBan}" style="width:60px"> 每秒最高點擊數 <input id="mc" value="${s.maxCps}" style="width:60px"><br>
<br><b>轉帳</b> 好友需滿 <input id="xm" value="${s.xferMinFriendMin}" style="width:55px"> 分鐘｜單筆上限 <input id="xx" value="${s.xferMax}" style="width:110px"> ｜24 小時轉出上限 <input id="xd" value="${s.xferDaily}" style="width:110px"> <small>(0=不限)</small><br><b>防作弊額外額度</b>（每小時可恢復的無法歸因收入）<input id="bh" value="${s.bucketHour}" style="width:120px"><br><button class="b" onclick="setS()">儲存</button><button class="b p" onclick="bk()">下載資料備份</button><label class="b g" style="display:inline-block;cursor:pointer">還原備份<input type="file" accept=".json" style="display:none" onchange="rs(this.files[0])"></label><button class="b g" onclick="logout()">登出後台</button></div>
<div class="card wrap"><h3>💸 最近轉帳（${xf.length}）</h3><table>${xf.slice(0,30).map(x=>`<tr><td>${ago(x.t)}</td><td>${esc(x.from)} → ${esc(x.to)}</td><td>$${fmt(x.amt)}</td></tr>`).join('')||'<tr><td>無</td></tr>'}</table></div><div class="card wrap"><h3>操作日誌 <input id="lq" placeholder="搜尋日誌" oninput="lg()" style="font-weight:normal"></h3><table id="lt"></table></div>`;lg()}};
const mkRows=d=>d.p.map((p,i)=>`<tr><td>股票代號 ${1000+i*13}</td><td>$${p.toFixed(2)}</td><td><button class="b" onclick="mkAct('shock',${i},1.5)">x1.5</button><button class="b r" onclick="mkAct('shock',${i},0.5)">x0.5</button><input id="mc${i}" placeholder="倍率" style="width:60px"><button class="b g" onclick="mkAct('shock',${i},v('mc${i}'))">自訂</button></td></tr>`).join('');
function mkAct(action,index,factor,on){A('market',{action,index,factor,on,announce:document.getElementById('mka')&&document.getElementById('mka').checked}).then(()=>R.mk())}
const lg=()=>{const q=v('lq').toLowerCase();$('#lt').innerHTML=window.LOG.filter(x=>x.m.toLowerCase().includes(q)).map(x=>`<tr><td>${ago(x.t)}</td><td>${esc(x.m)}</td></tr>`).join('')};
async function detail(id){const p=await A('player/'+id);$('#dt').innerHTML=`<div class="card"><h3>${esc(p.name)} ${p.banned?'🚫':''}${p.muted?' 🔇':''} <small>登入金鑰：${p.key}</small></h3>
<p>${p.hasPw?'🔑 已設密碼':'⚠ 尚未設定密碼'}｜現金 $${fmt(p.balance)}｜存款 ${fmt(p.bank)}｜貸款 ${fmt(p.loan)}｜待領取 ${p.pending}｜註冊 ${ago(p.created)}｜好友 ${p.friendCount} 位｜裝置 ${p.devCount} 台｜IP ${p.ips.map(esc).join(', ')||'-'}</p>
${p.alts.length?`<div class="warn"><b>🔗 疑似小號/同網路帳號：</b>${p.alts.map(a=>`<a href="#" onclick="detail('${a.id}');return false">${esc(a.name)}</a>(${a.by}${a.banned?'，已封鎖':''})`).join('、')}</div>`:''}
${p.flags.length?`<div class="warn"><b>⚠ 可疑紀錄（${p.strikes} 次）</b> <button class="b g" onclick="A('player/${id}/clearflags',{}).then(()=>detail('${id}'))">清除</button>${p.flags.slice(0,5).map(f=>`<div>${ago(f.t)}：${esc(f.r.join('；'))}</div>`).join('')}</div>`:''}
<form onsubmit="return false">${cmdForm('p','<button class="b y" onclick="pcmd(\''+id+'\')">執行</button>')}<br>
<input id="pmsg" placeholder="私訊（離線者上線時收到）" style="width:55%"><button class="b" onclick="A('player/${id}/cmd',{type:'msg',msg:v('pmsg')}).then(()=>alert('已送出'))">傳送私訊</button><br>
<textarea id="pnote" placeholder="管理員備註" style="width:70%;height:50px">${esc(p.note)}</textarea><button class="b" onclick="A('player/${id}/note',{note:v('pnote')}).then(()=>alert('已儲存'))">存備註</button></form>
${p.snaps.length?`<div style="margin:6px 0"><b>🕘 存檔快照（誤判或被盜時可回溯）</b>${p.snaps.map((s,i)=>`<div>${ago(s.t)}｜現金 ${fmt(s.balance)} <button class="b p" onclick="if(confirm('回溯到此快照？目前進度會被覆蓋'))A('player/${id}/rollback',{index:${i}}).then(()=>detail('${id}'))">回溯</button></div>`).join('')}</div>`:''}
<div id="cl" style="max-height:180px;overflow:auto;font-size:.82rem;margin:4px 0"></div><form onsubmit="return false" style="margin-top:6px"><b>處置：</b><input id="pb" placeholder="原因" style="width:140px"><input id="ph" placeholder="封鎖小時(空=永久)" style="width:130px"><input id="pih" placeholder="IP 封鎖小時" value="24" style="width:100px"><label><input type="checkbox" id="pa" checked>連同小號</label>
<button class="b r" onclick="pban('${id}')">徹底封鎖</button><button class="b g" onclick="A('player/${id}/ban',{banned:false}).then(()=>{R.pl();detail('${id}')})">解封</button><button class="b y" onclick="A('player/${id}/kick',{reason:v('pb')})">踢出</button><button class="b p" onclick="A('player/${id}/mute',{muted:${!p.muted}}).then(()=>detail('${id}'))">${p.muted?'解除禁言':'禁言'}</button><button class="b g" onclick="chats('${id}')">查看聊天</button>
<input id="pw2" placeholder="新密碼" style="width:100px"><button class="b y" onclick="A('player/${id}/resetpw',{pw:v('pw2')}).then(()=>alert('已重設，請把新密碼告訴玩家'))">重設密碼</button><input id="pn" placeholder="新名稱" style="width:110px"><button class="b" onclick="A('player/${id}/rename',{name:v('pn')}).then(()=>R.pl())">改名</button><button class="b r" onclick="if(confirm('永久刪除此玩家？'))A('player/${id}',null,'DELETE').then(()=>{$('#dt').innerHTML='';R.pl()})">刪除帳號</button></form></div>`;cf('p');$('#dt').scrollIntoView({behavior:'smooth'})}
async function chats(id){const c=await A('player/'+id+'/chats');$('#cl').innerHTML=c.length?c.map(x=>`<div><small>${ago(x.t)}</small> <b>${esc(x.from)}</b> → ${esc(x.to)}：${esc(x.m)}</div>`).join(''):'<small>沒有聊天紀錄</small>'}
function pcmd(id){A('player/'+id+'/cmd',getCmd('p')).then(r=>alert(r.online?'玩家在線，已即時套用':'玩家離線，下次上線時套用'))}
function pban(id){if(!confirm('確定徹底封鎖？將封鎖此帳號、裝置'+(v('pih')>0?'與 IP':'')+(document.getElementById('pa').checked?'，並連同同裝置小號':'')+'。'))return;A('player/'+id+'/ban',{banned:true,reason:v('pb')||'違規',hours:v('ph'),ipHours:v('pih'),alts:document.getElementById('pa').checked}).then(()=>{R.pl();detail(id)})}
function gift(){if(confirm('確定發放？'))A('gift',Object.assign(getCmd('g'),{target:v('gt')})).then(r=>alert('已發放給 '+r.count+' 位玩家'))}
function ann(){A('announce',{text:v('at'),style:v('as')}).then(()=>alert('已發送'))}
function evf(){const t=v('et'),P=['droprain','lottery','login','packet','contest'].includes(t),S=(id,on)=>document.getElementById(id).style.display=on?'inline':'none';S('f_f',!P);S('f_i',t=='rain'||t=='droprain');S('f_n',['lottery','packet','contest'].includes(t));S('f_r',t=='market');document.getElementById('f_p').style.display=P?'block':'none';if(t=='rain')$('#ef').placeholder='每次發放金額';else if(t=='market')$('#ef').placeholder='股價倍率（如 2 或 0.5）';else $('#ef').placeholder='倍率'}
function fill(o){$('#en').value=o.name||'限時活動';$('#et').value=o.type;$('#ef').value=o.factor||2;$('#ei').value=o.interval||30;$('#en2').value=o.n||3;$('#em').value=o.minutes||30;$('#er').value=o.repeat||'';$('#erv').checked=!!o.revert;if(o.pt){$('#zt').value=o.pt;$('#zv').value=o.pv||'';$('#zr').value=o.rar===undefined?'':o.rar;$('#zc').value=o.cnt||1;$('#zi').value=''}evf();cf('z');scrollTo(0,0)}
function tplx(i){const x=window.TPL[i];fill(Object.assign({name:x[0]},x[1]))}
function tpl2(e){const p=e.prize||{};fill({name:e.name,type:e.type,factor:e.factor,interval:e.interval,n:e.n,minutes:Math.round((e.end-e.start)/60000),repeat:e.repeat,revert:e.revert,pt:p.type,pv:p.value,rar:p.rarity,cnt:p.count})}
function tpl(n,t,f,m,i){tab('ev');setTimeout(()=>{$('#en').value=n;$('#et').value=t;$('#ef').value=f;$('#em').value=m;$('#ei').value=i;scrollTo(0,0)},150)}
function mkEv(){const t=v('et'),P=['droprain','lottery','login','packet','contest'].includes(t);A('events',{name:v('en'),type:t,factor:v('ef'),interval:v('ei'),n:v('en2'),minutes:v('em'),delayMinutes:v('ed'),repeat:v('er'),revert:document.getElementById('erv').checked,prize:P?getCmd('z'):undefined}).then(R.ev)}
function endEv(id){A('events/'+id+'/end',{}).then(R.ev)}
function mkCode(){A('codes',Object.assign(getCmd('k'),{code:v('cc'),maxUses:v('cu'),expireMinutes:Number(v('ce'))||0})).then(r=>{alert('已建立：'+r.code);R.cd()})}
function delCode(c){A('codes/'+c,null,'DELETE').then(R.cd)}
function setS(){A('settings',{maintenance:$('#mt').checked,motd:v('mo'),ac:v('ac'),autoBan:v('ab'),maxCps:v('mc'),xferMinFriendMin:v('xm'),xferMax:v('xx'),xferDaily:v('xd'),bucketHour:v('bh')}).then(()=>alert('已儲存'))}
async function bk(){const r=await fetch('/admin/api/backup',{headers:{'x-admin':T}});const u=URL.createObjectURL(await r.blob());Object.assign(document.createElement('a'),{href:u,download:'backup.json'}).click()}
async function rs(f){if(!f||!confirm('還原會覆蓋目前所有玩家資料，確定？'))return;try{const d=JSON.parse(await f.text());const r=await A('restore',{db:d});alert('已還原 '+r.players+' 位玩家')}catch(e){alert('還原失敗')}}
function csv(){const h=['名稱','現金','存款','貸款','重生','核心','Buff','可疑','封鎖'];const t=[h].concat(PL.map(p=>[p.name,p.balance,p.bank,p.loan,p.rebirths,p.cores,p.buffs,p.strikes,p.banned?'是':''])).map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');const u=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));Object.assign(document.createElement('a'),{href:u,download:'players.csv'}).click()}
document.getElementById('pw').addEventListener('keydown',e=>e.key=='Enter'&&login());if(T)A('overview').then(init).catch(()=>{});
</script></body></html>
